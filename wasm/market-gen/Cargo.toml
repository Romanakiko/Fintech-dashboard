[package]
name = "market-gen"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Seeded market-update generator compiled to WebAssembly"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
