<a class="skip-link" href="#main" (click)="skipToMain($event)">Skip to main content</a>

<header class="app-header">
  <div class="app-header__inner">
    <p class="app-brand">Realtime Fintech Dashboard</p>
    <nav class="app-nav" aria-label="Main">
      <a routerLink="/dashboard" routerLinkActive="is-active" ariaCurrentWhenActive="page">
        Dashboard
      </a>
      <a routerLink="/settings" routerLinkActive="is-active" ariaCurrentWhenActive="page">
        Settings
      </a>
    </nav>
    <app-producer-status />
  </div>
</header>

<main id="main" class="app-main" tabindex="-1">
  <app-error-banner />
  <router-outlet />
</main>

<footer class="app-footer">
  <div class="app-footer__inner">
    <app-build-info />
  </div>
</footer>
